<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3f8f72">
    <meta name="description" content="MiniCheck 是一款简洁、本地优先的日历打卡应用。">
    <link rel="icon" href="./assets/minicheck-icon.png">
    <link rel="stylesheet" href="./assets/styles.css">
    <title>MiniCheck · 极简打卡</title>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="MiniCheck 首页">
        <img src="./assets/minicheck-icon.png" alt="" width="38" height="38">
        <span>MiniCheck</span>
      </a>
      <nav aria-label="主要导航">
        <a href="./minicheck/privacy/">隐私政策</a>
        <a href="./minicheck/support/">支持与反馈</a>
      </nav>
    </header>

    <main class="home-main">
      <section class="hero">
        <img class="app-icon" src="./assets/minicheck-icon.png" alt="MiniCheck 日历勾选图标" width="132" height="132">
        <p class="eyebrow">本地优先的习惯日历</p>
        <h1>让每天的坚持，<br>清楚而轻松。</h1>
        <p class="hero-copy">MiniCheck 是一款简洁的日历打卡工具。无需注册账号，核心功能无需联网，项目与打卡记录保存在你的设备上。</p>
        <div class="hero-actions">
          <a class="button primary" href="./minicheck/support/">获取支持</a>
          <a class="button secondary" href="./minicheck/privacy/">查看隐私政策</a>
        </div>
      </section>

      <section class="feature-grid" aria-label="MiniCheck 特点">
        <article class="feature-card">
          <span class="feature-icon" aria-hidden="true">✓</span>
          <h2>轻松打卡</h2>
          <p>以月历和年历查看习惯进度，支持每天记录多次完成。</p>
        </article>
        <article class="feature-card">
          <span class="feature-icon" aria-hidden="true">▦</span>
          <h2>直观回顾</h2>
          <p>在单项月历、多项月历和年度视图之间快速切换。</p>
        </article>
        <article class="feature-card">
          <span class="feature-icon" aria-hidden="true">⌂</span>
          <h2>本地保存</h2>
          <p>无需登录和云端同步，个人打卡数据仅保存在设备本地。</p>
        </article>
      </section>
    </main>

    <footer>
      <span>© 2026 MiniCheck</span>
      <span class="footer-links"><a href="./minicheck/privacy/">隐私政策</a><a href="./minicheck/support/">支持与反馈</a></span>
    </footer>
  </body>
</html>
